<!doctype html>
<!-- Two telephone fields in one form. The fill must not be confused by the second box: it fills
     the ONE best candidate (the autocomplete=tel one) and leaves the bare second box alone,
     because on a real form a second tel box can be "confirm phone" or an unrelated "landline" -
     a guess the fill refuses to make.
     Found on: the react-input-mask demo page, whose form carries two tel inputs. -->
<title>mask-two-tel</title>
<script type="application/json" id="fill-contract">
{
 "identifier_type": "phone",
 "identifier": "79991234567",
 "reveal": null,
 "expect": {
  "result": "filled",
  "filled_fields": 2,
  "tel_values": [
   "79991234567",
   ""
  ]
 }
}
</script>
<form><input id=phone name=phone type=tel autocomplete=tel><input name=phone2 type=tel><input name=pw type=password></form>
<script>
  for (const el of document.querySelectorAll('[type=tel]')) {
    el.addEventListener('input', () => {
      const d = el.value.replace(/\D/g, '').slice(0, 11);
      el.value = d.replace(/^(\d{3})(\d{3})(\d{2})(\d{2})(\d+)$/, '$1 $2 $3 $4 $5');
    });
  }
</script>
