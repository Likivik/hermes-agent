<!doctype html>
<!-- A mask that holds fewer digits than the stored value. The length axis of the mask family,
     and the one case that is a limit: the fill must say what the field kept, never blame a
     cause, and never describe a secret.
     Found on: https://cab.y-plus.ru (kept 10 of 13), the react-input-mask demo (kept 7 of 11),
     the jQuery-Mask-Plugin demo (kept 8 of 11), intl-tel-input (kept 9 of 11 - this page's exact
     shape). The message reads "The field kept 9 of the 11 digits of the stored value." -->
<title>mask-truncate</title>
<form><input id=phone name=phone type=tel autocomplete=tel><input name=pw type=password></form>
<script>
  // keeps only the first 9 digits
  const el = document.getElementById('phone');
  el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(0, 9); });
</script>
