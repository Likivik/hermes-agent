name: Vault fill fixtures e2e

# Runs the one eval that pins down every fill behaviour we found on real sites, as checked-in
# pages under evals/vault_fill_pages/ - offline, deterministic, no fixture checkout, no list.
# It lives as its own workflow because CI's suite discovers tests/ only and never runs evals/,
# and because it drives a real browser. Where each page came from is written in the HTML
# comment inside the page itself; the 124-row list that produced them is in git history.
#
# The trigger is a push to this branch and not workflow_dispatch: GitHub only dispatches a workflow
# that exists on the default branch, and this one is meant to stay off it. A push trigger is read
# from the pushed ref, so the branch carries its own tests.

on:
  workflow_dispatch:
  push:
    branches:
      - vault-fill-resilience

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'

      - name: The nine fill behaviours
        env:
          HERMES_E2E_BROWSER: '1'
        run: '"$HERMES_PYTHON" evals/vault_fill_fixtures_e2e.py'
