name: Vault masks e2e

# Runs the evals that pin down the fill behaviours the site list found. They live as their own
# workflow because CI's suite discovers tests/ only and never runs evals/, and because they drive a
# real browser. The lists under evals/vault_fill_sites/ are the checked-by-hand record those evals
# are generated from.
#
# The trigger is a push to this branch and not workflow_dispatch: GitHub only dispatches a workflow
# that exists on the default branch, and this one is meant to stay off it. A push trigger is read
# from the pushed ref, so the branch carries its own tests.

on:
  workflow_dispatch:
  push:
    branches:
      - vault-fill-resilience

jobs:
  masks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'

      - name: The three fill behaviours
        env:
          HERMES_E2E_BROWSER: '1'
        run: '"$HERMES_PYTHON" evals/vault_fill_masks_e2e.py'

      - name: The classes the site list contains
        env:
          HERMES_E2E_BROWSER: '1'
        run: '"$HERMES_PYTHON" evals/vault_fill_list_classes.py'
